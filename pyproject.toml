[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acc-mcp"
version = "0.1.0"
description = "ACC v1 MCP binding — parse Agent Capability Contract declarations from MCP tool schemas"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Yunare Maia", email = "yunare@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Security",
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
acc-mcp = "acc_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/acc_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
